<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHN 회의록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --accent: #3b7dd8;
    --accent-light: #5a9ae8;
    --gold: #d4a017;
    --bg: #f0f2f5;
    --bg-card: #ffffff;
    --bg-input: #f5f6f8;
    --border: #dde1e8;
    --text: #1a1f2e;
    --text-muted: #5a6478;
    --text-dim: #8a94a8;
    --green: #1a9e5c;
    --red: #d93535;
    --header-bg: #2c3e6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  header { background: var(--header-bg); padding: 13px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px #0002; }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: #fff; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: #f0c040; }
  .header-date { font-size: 12px; color: #a8b8d8; font-family: 'JetBrains Mono', monospace; }

  /* Tabs */
  .tabs { display: flex; background: var(--header-bg); border-bottom: 1px solid #1e2d56; padding: 0 28px; }
  .tab { padding: 11px 20px; font-size: 13px; font-weight: 500; color: #8898c0; cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; }
  .tab:hover { color: #c8d8f0; }
  .tab.active { color: #fff; border-bottom-color: #f0c040; }

  main { flex: 1; padding: 20px 24px; }
  .page { display: none; }
  .page.active { display: block; }

  /* Write layout */
  .write-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; height: calc(100vh - 148px); }
  @media (max-width: 900px) { .write-layout { grid-template-columns: 1fr; height: auto; } }

  .panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 1px 4px #0001; }
  .panel-header { padding: 14px 18px; border-bottom: 1px solid var(--border); font-size: 11px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--text-muted); display: flex; align-items: center; justify-content: space-between; background: #fafbfc; }
  .panel-body { flex: 1; overflow-y: auto; padding: 18px; }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Form */
  label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 5px; font-weight: 600; }
  input[type=text], input[type=date], select, textarea {
    width: 100%; background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: inherit; font-size: 13px;
    padding: 9px 12px; margin-bottom: 14px; transition: border-color .2s; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  textarea { resize: vertical; }
  select option { background: #fff; }

  /* Tag input row */
  .tag-row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 14px; min-height: 34px; padding: 6px 8px; background: var(--bg-input); border: 1px solid var(--border); border-radius: 8px; }
  .tag-row:focus-within { border-color: var(--accent); background: #fff; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 14px; font-size: 12px; font-weight: 600;
    background: #e8eef8; border: 1px solid #c0cce8; color: var(--accent);
  }
  .tag .tag-del { cursor: pointer; font-size: 13px; color: var(--text-dim); line-height: 1; margin-left: 2px; }
  .tag .tag-del:hover { color: var(--red); }
  .tag-input { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13px; color: var(--text); min-width: 80px; flex: 1; padding: 2px 4px; }
  .add-btn { padding: 2px 10px; border-radius: 14px; font-size: 12px; font-weight: 700; background: var(--accent); color: #fff; border: none; cursor: pointer; white-space: nowrap; }
  .add-btn:hover { background: var(--accent-light); }

  /* Record button */
  .record-section { display: flex; align-items: center; gap: 14px; background: #f0f4ff; border: 1px solid #c8d4f0; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .rec-btn { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); border: none; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; transition: all .2s; flex-shrink: 0; text-decoration: none; }
  .rec-btn:hover { background: var(--accent-light); transform: scale(1.05); }
  .rec-info .rec-title { font-size: 13px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
  .rec-info .rec-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

  /* Gen button */
  .gen-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .gen-btn:hover { background: var(--accent-light); transform: translateY(-1px); box-shadow: 0 4px 12px #3b7dd830; }
  .gen-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* Right sections */
  .right-section { margin-bottom: 18px; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .sdot { width: 6px; height: 6px; border-radius: 50%; }
  .sdot-blue { background: var(--accent); }
  .sdot-gold { background: var(--gold); }
  .sdot-green { background: var(--green); }

  .summary-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 14px; font-size: 13px; line-height: 1.85; color: var(--text); white-space: pre-wrap; min-height: 100px; }
  .summary-empty { color: var(--text-dim); font-style: italic; text-align: center; padding: 28px 0; font-size: 13px; }

  .memo-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 13px; padding: 11px 12px; min-height: 80px; resize: vertical; outline: none; transition: border-color .2s; line-height: 1.7; }
  .memo-input:focus { border-color: var(--gold); background: #fff; }

  .todo-items { display: flex; flex-direction: column; gap: 7px; }
  .todo-row { display: flex; align-items: flex-start; gap: 9px; background: var(--bg-input); border-radius: 8px; padding: 9px 12px; border: 1px solid var(--border); }
  .todo-check { width: 17px; height: 17px; border-radius: 4px; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; transition: all .2s; background: #fff; }
  .todo-check.done { background: var(--green); border-color: var(--green); }
  .todo-check.done::after { content: '✓'; font-size: 10px; color: #fff; font-weight: 700; }
  .todo-text { font-size: 12px; line-height: 1.6; flex: 1; color: var(--text); }
  .todo-text.done { text-decoration: line-through; opacity: .5; }
  .todo-empty { font-size: 12px; color: var(--text-dim); text-align: center; padding: 14px 0; }

  /* Panel footer */
  .panel-footer { padding: 14px 18px; border-top: 1px solid var(--border); background: #fafbfc; flex-shrink: 0; }
  .write-layout .panel { display: flex; flex-direction: column; }
  .write-layout .panel .panel-body { flex: 1; overflow-y: auto; }
  .notion-btn { width: 100%; padding: 12px; background: #1f1f1f; border: none; border-radius: 10px; color: #fff; font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transition: all .2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .notion-btn:hover { background: #333; transform: translateY(-1px); }
  .notion-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* Archive */
  .arch-header { display: flex; gap: 10px; margin-bottom: 18px; }
  .arch-header input { margin-bottom: 0; }
  .arch-filter { width: auto; margin-bottom: 0; min-width: 130px; }
  .note-list { display: flex; flex-direction: column; gap: 10px; }
  .note-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; cursor: pointer; transition: all .2s; display: flex; justify-content: space-between; gap: 16px; box-shadow: 0 1px 3px #0001; }
  .note-card:hover { border-color: var(--accent); transform: translateX(3px); box-shadow: 0 2px 8px #3b7dd820; }
  .note-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
  .note-meta { font-size: 12px; color: var(--text-muted); }
  .note-preview { font-size: 12px; color: var(--text-dim); margin-top: 5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .dept-tag { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; background: #e8eef8; color: var(--accent); margin: 2px; }
  .empty-state { text-align: center; padding: 60px; color: var(--text-dim); }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  /* Todo page */
  .todo-filters { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; font-size: 12px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); cursor: pointer; transition: all .2s; font-family: inherit; }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .full-todo-list { display: flex; flex-direction: column; gap: 8px; }
  .full-todo-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 13px 16px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; box-shadow: 0 1px 3px #0001; }
  .ftodo-check { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s; background: #fff; }
  .ftodo-check.done { background: var(--green); border-color: var(--green); }
  .ftodo-check.done::after { content: '✓'; font-size: 11px; color: #fff; font-weight: 700; }
  .ftodo-text { font-size: 13px; color: var(--text); }
  .ftodo-text.done { text-decoration: line-through; opacity: .5; }
  .ftodo-right { text-align: right; font-size: 11px; }
  .ftodo-dept { color: var(--accent); font-weight: 600; }
  .ftodo-due { color: var(--text-dim); margin-top: 2px; }
  .ftodo-due.overdue { color: var(--red); font-weight: 700; }
  .ftodo-due.soon { color: var(--gold); font-weight: 600; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: #00000050; z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 28px; box-shadow: 0 8px 32px #0002; }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; gap: 12px; }
  .modal-title { font-size: 17px; font-weight: 700; color: var(--text); }
  .modal-close { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 15px; cursor: pointer; padding: 4px 10px; flex-shrink: 0; transition: all .2s; }
  .modal-close:hover { border-color: var(--red); color: var(--red); }
  .modal-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 14px; }
  .modal-body { font-size: 13px; line-height: 1.9; white-space: pre-wrap; color: var(--text); }
  .modal-del { margin-top: 20px; padding: 8px 16px; background: none; border: 1px solid var(--red); border-radius: 8px; color: var(--red); font-family: inherit; font-size: 12px; cursor: pointer; transition: all .2s; }
  .modal-del:hover { background: #d9353510; }

  .notion-modal { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; max-width: 460px; width: 100%; padding: 28px; box-shadow: 0 8px 32px #0002; }

  /* Spinner */
  .spinner { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #ffffff60; border-top-color: #fff; animation: spin .7s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Toast */
  .toast { position: fixed; bottom: 28px; right: 28px; background: var(--header-bg); border: 1px solid #4a6aaa; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 13px; z-index: 300; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; transform: translateY(6px); }
  .toast.show { opacity: 1; transform: none; }

  .divider { height: 1px; background: var(--border); margin: 14px 0; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>AHN 회의록</div>
  <div class="header-date" id="headerDate"></div>
</header>

<div class="tabs">
  <div class="tab active" onclick="showPage('write',this)">📝 회의록 작성</div>
  <div class="tab" onclick="showPage('archive',this)">🔍 검색</div>
  <div class="tab" onclick="showPage('todos',this)">✅ To-Do</div>
</div>

<main>

<!-- ══ WRITE PAGE ══ -->
<div class="page active" id="page-write">
  <div class="write-layout">

    <!-- LEFT PANEL -->
    <div class="panel">
      <div class="panel-header">회의 정보 입력</div>
      <div class="panel-body" style="overflow-y:hidden">

        <!-- 녹음 버튼 (컴팩트) -->
        <div style="display:flex;align-items:center;gap:12px;background:#f0f4ff;border:1px solid #c8d4f0;border-radius:10px;padding:10px 14px;margin-bottom:14px">
          <a href="https://clovanote.naver.com" target="_blank" style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px;text-decoration:none;flex-shrink:0">🎙</a>
          <div>
            <div style="font-size:13px;font-weight:700;color:var(--text)">클로바 노트로 녹음하기</div>
            <div style="font-size:11px;color:var(--text-muted)">버튼을 누르면 클로바 노트가 열려요. 녹음 후 변환 텍스트를 아래에 붙여넣으세요.</div>
          </div>
        </div>

        <!-- 날짜 + 안건 한 줄 -->
        <div style="display:grid;grid-template-columns:140px 1fr;gap:10px">
          <div>
            <label>회의 날짜</label>
            <input type="date" id="iDate" style="margin-bottom:12px">
          </div>
          <div>
            <label>안건 (회의 제목)</label>
            <input type="text" id="iTitle" placeholder="안건을 작성하세요." style="margin-bottom:12px">
          </div>
        </div>

        <label>참석 부서</label>
        <div class="tag-row" id="deptRow">
          <input class="tag-input" id="deptInput" placeholder="부서명 입력 후 +" onkeydown="if(event.key==='Enter')addTag('dept')">
          <button class="add-btn" onclick="addTag('dept')">+</button>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">
          <span style="font-size:11px;color:var(--text-dim);margin-right:2px;line-height:22px">빠른선택:</span>
          <button onclick="addPreset('dept','CA(기획조정실)')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">CA</button>
          <button onclick="addPreset('dept','HR본부')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">HR본부</button>
          <button onclick="addPreset('dept','재무기획팀')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">재무기획팀</button>
          <button onclick="addPreset('dept','외부')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">외부</button>
        </div>

        <label>참여자</label>
        <div class="tag-row" id="attendeeRow">
          <input class="tag-input" id="attendeeInput" placeholder="이름 입력 후 +" onkeydown="if(event.key==='Enter')addTag('attendee')">
          <button class="add-btn" onclick="addTag('attendee')">+</button>
        </div>

        <label style="margin-top:2px">회의 유형</label>
        <div class="tag-row" id="typeRow" style="margin-bottom:5px">
          <input class="tag-input" id="typeInput" placeholder="유형 입력 후 +" onkeydown="if(event.key==='Enter')addTag('type')">
          <button class="add-btn" onclick="addTag('type')">+</button>
        </div>
        <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px">
          <span style="font-size:11px;color:var(--text-dim);margin-right:2px;line-height:22px">빠른선택:</span>
          <button onclick="addPreset('type','업무조정')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">업무조정</button>
          <button onclick="addPreset('type','탑팀보고')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">탑팀보고</button>
          <button onclick="addPreset('type','업무지시')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">업무지시</button>
          <button onclick="addPreset('type','기타')" style="padding:3px 9px;border-radius:12px;font-size:11px;border:1px solid var(--border);background:var(--bg-input);cursor:pointer;color:var(--text-muted)">기타</button>
        </div>

        <div class="divider"></div>

        <label>클로바 노트 변환 텍스트 붙여넣기</label>
        <textarea id="iTranscript" placeholder="클로바 노트에서 변환된 텍스트를 여기에 붙여넣으세요." style="min-height:100px;margin-bottom:12px"></textarea>

        <button class="gen-btn" id="genBtn" onclick="generate()">
          <span id="genIcon">✨</span>
          <span id="genText">회의록 생성</span>
        </button>

      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel">
      <div class="panel-header">
        <span>회의록 결과</span>
        <span id="resultStatus" style="font-size:11px;color:var(--text-dim)">생성 전</span>
      </div>
      <div class="panel-body">

        <!-- STEP 1: Claude 요약 결과 -->
        <div class="right-section">
          <div class="section-label"><div class="sdot sdot-blue"></div>① Claude 요약 결과</div>
          <div class="summary-box" id="summaryBox">
            <div class="summary-empty">왼쪽에서 회의록 생성을 누르면<br>여기에 안내가 나타납니다</div>
          </div>
          <button id="pasteResultBtn" onclick="pasteResult()" style="display:none;margin-top:10px;width:100%;padding:10px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;">
            📋 Claude.ai 결과 붙여넣기
          </button>
        </div>

        <!-- STEP 2: 내 기록 -->
        <div class="right-section">
          <div class="section-label"><div class="sdot sdot-gold"></div>② 내 기록 <span style="font-weight:400;font-size:10px;color:var(--text-dim);margin-left:4px">(요약 확인 후 추가할 내용 입력)</span></div>
          <textarea class="memo-input" id="iMemo" placeholder="추가 의견, 내 판단, 놓친 내용 등을 자유롭게 입력하세요."></textarea>
        </div>

        <!-- STEP 3: To-Do (저장 후 표시) -->
        <div class="right-section" id="todoSection" style="display:none">
          <div class="section-label"><div class="sdot sdot-green"></div>③ To-Do 목록 <span style="font-weight:400;font-size:10px;color:var(--text-dim);margin-left:4px">(저장 시 자동 추출)</span></div>
          <div class="todo-items" id="todoItems"></div>
        </div>

      </div>
      <div class="panel-footer">
        <!-- 저장 버튼: 요약+내기록+To-Do 합쳐서 노션 저장 -->
        <button class="notion-btn" id="notionBtn" onclick="saveAll()">
          ◼ 확인 완료 — 노션에 저장
        </button>
      </div>
    </div>

  </div>
</div>

<!-- ══ ARCHIVE PAGE ══ -->
<div class="page" id="page-archive">
  <div class="arch-header">

<script>
let notes = JSON.parse(localStorage.getItem('ahn_notes') || '[]');
let todos = JSON.parse(localStorage.getItem('ahn_todos') || '[]');
let currentSummary = '';
let todoFilter = 'all';
let deptTags = [];
let attendeeTags = [];
let typeTags = [];

document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('iDate').value = today.toISOString().split('T')[0];
  document.getElementById('headerDate').textContent =
    today.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
});

// ── Page nav ──
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'archive') renderArchive();
  if (name === 'todos') renderTodos();
}

// ── Tag input ──
function addTag(type) {
  const inputId = type === 'dept' ? 'deptInput' : type === 'attendee' ? 'attendeeInput' : 'typeInput';
  const rowId = type === 'dept' ? 'deptRow' : type === 'attendee' ? 'attendeeRow' : 'typeRow';
  const arr = type === 'dept' ? deptTags : type === 'attendee' ? attendeeTags : typeTags;
  const val = document.getElementById(inputId).value.trim();
  if (!val || arr.includes(val)) { document.getElementById(inputId).value = ''; return; }
  arr.push(val);
  document.getElementById(inputId).value = '';
  renderTags(type);
}

function addPreset(type, val) {
  const arr = type === 'dept' ? deptTags : type === 'attendee' ? attendeeTags : typeTags;
  if (!arr.includes(val)) { arr.push(val); renderTags(type); }
}

function removeTag(type, val) {
  if (type === 'dept') deptTags = deptTags.filter(t => t !== val);
  else if (type === 'attendee') attendeeTags = attendeeTags.filter(t => t !== val); else typeTags = typeTags.filter(t => t !== val);
  renderTags(type);
}

function renderTags(type) {
  const rowId = type === 'dept' ? 'deptRow' : type === 'attendee' ? 'attendeeRow' : 'typeRow';
  const inputId = type === 'dept' ? 'deptInput' : type === 'attendee' ? 'attendeeInput' : 'typeInput';
  const arr = type === 'dept' ? deptTags : type === 'attendee' ? attendeeTags : typeTags;
  const row = document.getElementById(rowId);
  // Remove existing tags
  row.querySelectorAll('.tag').forEach(t => t.remove());
  // Re-add tags before input
  const input = document.getElementById(inputId);
  arr.forEach(v => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    tag.innerHTML = `${v}<span class="tag-del" onclick="removeTag('${type}','${v}')">×</span>`;
    row.insertBefore(tag, input);
  });
}

// ── Generate ──
async function generate() {
  const transcript = document.getElementById('iTranscript').value.trim();
  const memo = document.getElementById('iMemo').value.trim();
  if (!transcript && !memo) {
    showToast('클로바 노트 텍스트 또는 내 기록을 입력해주세요');
    return;
  }

  const title = document.getElementById('iTitle').value.trim() || '회의';
  const date = document.getElementById('iDate').value;
  const type = typeTags.join(', ') || '기타';

  const prompt = `아래 정보로 회의록을 작성해줘. 본부장이 직접 작성한 것처럼 자연스럽고 간결하게.

[회의 정보]
- 안건: ${title}
- 날짜: ${date}
- 참석 부서: ${deptTags.join(', ') || '미선택'}
- 참여자: ${attendeeTags.join(', ') || '미입력'}
- 회의 유형: ${type}

${transcript ? `[클로바 노트 변환 텍스트]\n${transcript}` : ''}
${memo ? `[본부장 메모]\n${memo}` : ''}

아래 형식으로 작성해줘:

## 회의 목적
(핵심 목적 한두 문장)

## 주요 논의 내용
(부서별/주제별로 bullet 정리)

## 결정 사항
(확정된 내용만 명확히)

## To-Do
- 담당: [부서/담당자] | [할 일 내용] | 마감: YYYY-MM-DD
(마감일 불명확하면 "협의 필요"로)

## 후속 조치
(다음 회의, 보고 일정 등)`;

  // 프롬프트를 클립보드에 복사 후 claude.ai 새탭으로 열기
  try {
    await navigator.clipboard.writeText(prompt);
    showToast('✓ 프롬프트 복사 완료! Claude.ai에 붙여넣기 하세요');
  } catch(e) {
    // 클립보드 실패 시 텍스트에어리어로 대체
    const ta = document.createElement('textarea');
    ta.value = prompt;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('✓ 프롬프트 복사 완료! Claude.ai에 붙여넣기 하세요');
  }

  // Claude.ai 새 탭으로 열기
  window.open('https://claude.ai/new', '_blank');

  // 안내 메시지 표시
  document.getElementById('summaryBox').innerHTML = `
    <div style="padding:20px;line-height:2;font-size:13px;color:var(--text-muted)">
      <div style="font-size:15px;font-weight:700;color:var(--text);margin-bottom:12px">📋 다음 단계</div>
      <div>① 새로 열린 <b>Claude.ai</b> 탭에서</div>
      <div>② <b>Ctrl+V</b> (붙여넣기) → Enter</div>
      <div>③ 회의록 생성되면 <b>전체 복사</b></div>
      <div>④ 아래 <b>"결과 붙여넣기"</b> 버튼 클릭</div>
    </div>`;
  document.getElementById('resultStatus').textContent = 'Claude.ai에서 작성 중';
  document.getElementById('resultStatus').style.color = 'var(--gold)';

  // 결과 붙여넣기 버튼 표시
  document.getElementById('pasteResultBtn').style.display = 'block';
}

// ── Paste result from Claude.ai ──
async function pasteResult() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text.trim()) { showToast('클립보드가 비어있어요. Claude.ai에서 복사 후 다시 눌러주세요'); return; }
    currentSummary = text.trim();
    document.getElementById('summaryBox').textContent = currentSummary;
    document.getElementById('resultStatus').textContent = '✓ 생성 완료';
    document.getElementById('resultStatus').style.color = 'var(--green)';
    document.getElementById('pasteResultBtn').style.display = 'none';
    renderInlineTodos(currentSummary);
    showToast('✓ 회의록이 입력됐습니다');
  } catch(e) {
    showToast('클립보드 접근 실패. 브라우저 권한을 확인해주세요.');
  }
}


function renderInlineTodos(content) {
  const lines = content.split('\n');
  let inTodo = false;
  const extracted = [];
  for (const line of lines) {
    if (line.includes('To-Do') || line.includes('TODO')) { inTodo = true; continue; }
    if (line.startsWith('## ') && inTodo) inTodo = false;
    if (!inTodo) continue;
    const t = line.replace(/^[-•*]\s*/, '').trim();
    if (t.length > 4) extracted.push(t);
  }
  const container = document.getElementById('todoItems');
  if (!extracted.length) {
    container.innerHTML = '<div class="todo-empty">To-Do 항목이 없습니다</div>';
    return;
  }
  container.innerHTML = extracted.map((t, i) => `
    <div class="todo-row">
      <div class="todo-check" id="itc_${i}" onclick="toggleInlineTodo(${i})"></div>
      <div class="todo-text" id="itt_${i}">${t}</div>
    </div>`).join('');
}
function toggleInlineTodo(i) {
  document.getElementById('itc_' + i).classList.toggle('done');
  document.getElementById('itt_' + i).classList.toggle('done');
}

// ── Save All (요약 + 내기록 + ToDo → 노션) ──
function saveAll() {
  if (!currentSummary) { showToast('먼저 회의록을 생성하고 붙여넣기 해주세요'); return; }
  const key = localStorage.getItem('notion_key');
  const db = localStorage.getItem('notion_db');

  // To-Do 추출 및 표시
  const extracted = extractTodos(currentSummary);
  if (extracted.length) {
    document.getElementById('todoSection').style.display = 'block';
    document.getElementById('todoItems').innerHTML = extracted.map((t,i) => `
      <div class="todo-row">
        <div class="todo-check" id="itc_${i}" onclick="toggleInlineTodo(${i})"></div>
        <div class="todo-text" id="itt_${i}">${t}</div>
      </div>`).join('');
  }

  if (!key || !db) { openNotionModal(); return; }
  uploadToNotion(key, db);
}

function extractTodos(content) {
  const lines = content.split('\n');
  let inTodo = false;
  const result = [];
  for (const line of lines) {
    if (line.includes('To-Do') || line.includes('TODO')) { inTodo = true; continue; }
    if (line.startsWith('## ') && inTodo) inTodo = false;
    if (!inTodo) continue;
    const t = line.replace(/^[-•*]\s*/, '').trim();
    if (t.length > 4) result.push(t);
  }
  return result;
}


function saveToNotion() {
  if (!currentSummary) { showToast('먼저 회의록을 생성해주세요'); return; }
  const key = localStorage.getItem('notion_key');
  const db = localStorage.getItem('notion_db');
  if (!key || !db) { openNotionModal(); return; }
  uploadToNotion(key, db);
}
function openNotionModal() {
  const k = localStorage.getItem('notion_key');
  const t = localStorage.getItem('notion_todo_db');
  if (k) document.getElementById('nKey').value = k;
  if (t) document.getElementById('nTodoDb').value = t;
  document.getElementById('notionOverlay').classList.add('open');
}
function closeNotionModal() { document.getElementById('notionOverlay').classList.remove('open'); }
function confirmNotion() {
  const k = document.getElementById('nKey').value.trim();
  const d = document.getElementById('nDb').value.trim();
  const td = document.getElementById('nTodoDb').value.trim();
  if (!k || !d) { showToast('API 키와 회의록 DB ID를 입력해주세요'); return; }
  localStorage.setItem('notion_key', k);
  localStorage.setItem('notion_db', d);
  if (td) localStorage.setItem('notion_todo_db', td);
  closeNotionModal();
  uploadToNotion(k, d);
}

async function uploadToNotion(apiKey, dbId) {
  const title = document.getElementById('iTitle').value.trim() || '무제 회의';
  const date = document.getElementById('iDate').value;
  const memo = document.getElementById('iMemo').value.trim();
  const fullContent = currentSummary + (memo ? '\n\n---\n## 내 기록\n' + memo : '');

  const btn = document.getElementById('notionBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> 저장 중...';

  // 회의록 노션 저장
  const chunks = [];
  for (let i = 0; i < fullContent.length; i += 1900) chunks.push(fullContent.slice(i, i+1900));
  const blocks = chunks.map(c => ({ object:'block', type:'paragraph', paragraph:{ rich_text:[{ type:'text', text:{ content:c } }] } }));

  const props = { '이름': { title: [{ text: { content: title } }] } };
  if (date) props['날짜'] = { date: { start: date } };
  if (deptTags.length) props['부서'] = { multi_select: deptTags.map(d => ({ name: d })) };
  if (typeTags.length) props['회의유형'] = { select: { name: typeTags[0] } };

  try {
    const res = await fetch('https://api.notion.com/v1/pages', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'Notion-Version': '2022-06-28' },
      body: JSON.stringify({ parent: { database_id: dbId }, properties: props, children: blocks })
    });

    if (res.ok) {
      showToast('✓ 회의록 저장 완료! To-Do 저장 중...');
      saveLocal();

      // To-Do DB에 항목 저장
      const todoDbId = localStorage.getItem('notion_todo_db');
      if (todoDbId) {
        await uploadTodosToNotion(apiKey, todoDbId, title, date);
      }
      showToast('✓ 회의록 + To-Do 모두 노션에 저장됐습니다!');
    } else {
      const err = await res.json();
      if (err.code === 'unauthorized') { showToast('API 키를 확인해주세요'); openNotionModal(); }
      else { showToast('저장 실패: ' + (err.message || '오류')); console.error(err); }
    }
  } catch(e) {
    showToast('네트워크 오류: ' + e.message);
    console.error(e);
  }
  btn.disabled = false;
  btn.innerHTML = '◼ 확인 완료 — 노션에 저장';
}

async function uploadTodosToNotion(apiKey, todoDbId, meetingTitle, meetingDate) {
  const todoList = extractTodos(currentSummary);
  if (!todoList.length) return;

  const promises = todoList.map(async (todoText) => {
    const dueMatch = todoText.match(/마감[:\s]+(\d{4}-\d{2}-\d{2})/);
    const deptMatch = todoText.match(/담당[:\s]+([^|]+)\|/);
    const cleanText = todoText
      .replace(/담당[:\s]+[^|]+\|\s*/, '')
      .replace(/\|\s*마감[:\s]+[\d-]+/, '')
      .trim();
    const dept = deptMatch ? deptMatch[1].trim() : (deptTags[0] || '');
    const due = dueMatch ? dueMatch[1] : null;

    const todoProps = {
      '안건': { title: [{ text: { content: cleanText || todoText } }] },
      '상태': { status: { name: '진행 전' } },
      '회의록': { rich_text: [{ text: { content: meetingTitle } }] },
    };
    if (due) todoProps['날짜'] = { date: { start: due } };
    else if (meetingDate) todoProps['날짜'] = { date: { start: meetingDate } };
    if (dept) todoProps['부서'] = { select: { name: dept } };

    try {
      await fetch('https://api.notion.com/v1/pages', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'Notion-Version': '2022-06-28' },
        body: JSON.stringify({ parent: { database_id: todoDbId }, properties: todoProps })
      });
    } catch(e) { console.error('Todo 저장 실패:', e); }
  });

  await Promise.all(promises);
}

function saveLocal() {
  const note = {
    id: Date.now(),
    title: document.getElementById('iTitle').value.trim() || '무제',
    date: document.getElementById('iDate').value,
    depts: [...deptTags],
    type: typeTags.join(', ') || '기타',
    content: currentSummary,
    memo: document.getElementById('iMemo').value.trim(),
    createdAt: new Date().toISOString()
  };
  notes.unshift(note);
  localStorage.setItem('ahn_notes', JSON.stringify(notes));
  extractTodos(currentSummary).forEach(t => {
    const dueMatch = t.match(/마감[:\s]+(\d{4}-\d{2}-\d{2})/);
    const deptMatch = t.match(/담당[:\s]+([^|]+)\|/);
    todos.push({ id: Date.now() + Math.random(), text: t, dept: deptMatch ? deptMatch[1].trim() : (deptTags[0]||''), due: dueMatch ? dueMatch[1] : null, done: false, noteId: note.id, noteTitle: note.title });
  });
  localStorage.setItem('ahn_todos', JSON.stringify(todos));
}

// ── Archive ──
function renderArchive() {
  const q = (document.getElementById('searchQ')?.value || '').toLowerCase();
  const dept = document.getElementById('filterDept')?.value || '';
  let list = notes.filter(n => {
    if (dept && !n.depts.includes(dept)) return false;
    if (q && !n.title.toLowerCase().includes(q) && !n.content.toLowerCase().includes(q)) return false;
    return true;
  });
  const el = document.getElementById('noteList');
  if (!list.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div>저장된 회의록이 없습니다</div>`; return; }
  el.innerHTML = list.map(n => `
    <div class="note-card" onclick="openDetail(${n.id})">
      <div>
        <div class="note-title">${n.title}</div>
        <div class="note-meta">${n.date} · ${n.type}</div>
        <div class="note-preview">${n.content.substring(0,100)}...</div>
      </div>
      <div style="text-align:right;flex-shrink:0">${(n.depts||[]).map(d=>`<span class="dept-tag">${d}</span>`).join('')}</div>
    </div>`).join('');
}
function openDetail(id) {
  const n = notes.find(n => n.id === id);
  if (!n) return;
  document.getElementById('detailTitle').textContent = n.title;
  document.getElementById('detailMeta').textContent = n.date + ' · ' + (n.depts||[]).join(', ') + ' · ' + n.type;
  document.getElementById('detailBody').textContent = n.content + (n.memo ? '\n\n---\n내 기록:\n' + n.memo : '');
  document.getElementById('detailDelBtn').onclick = () => deleteNote(id);
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
function deleteNote(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  notes = notes.filter(n => n.id !== id);
  todos = todos.filter(t => t.noteId !== id);
  localStorage.setItem('ahn_notes', JSON.stringify(notes));
  localStorage.setItem('ahn_todos', JSON.stringify(todos));
  closeDetail(); renderArchive(); renderTodos();
  showToast('삭제됐습니다');
}

// ── Todos ──
function setFilter(f, el) {
  todoFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTodos();
}
function renderTodos() {
  const today = new Date().toISOString().split('T')[0];
  const soon = new Date(Date.now() + 3*24*60*60*1000).toISOString().split('T')[0];
  let list = [...todos];
  if (todoFilter === 'pending') list = list.filter(t => !t.done);
  if (todoFilter === 'done') list = list.filter(t => t.done);
  if (todoFilter === 'overdue') list = list.filter(t => !t.done && t.due && t.due < today);
  list.sort((a,b) => (!a.due?1:!b.due?-1:a.due.localeCompare(b.due)));
  const el = document.getElementById('fullTodoList');
  if (!list.length) { el.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div>해당 항목이 없습니다</div>`; return; }
  el.innerHTML = list.map(t => {
    let dc = '';
    if (t.due) { if (t.due < today) dc='overdue'; else if (t.due <= soon) dc='soon'; }
    return `<div class="full-todo-item">
      <div class="ftodo-check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')"></div>
      <div>
        <div class="ftodo-text ${t.done?'done':''}">${t.text}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:2px">${t.noteTitle||''}</div>
      </div>
      <div class="ftodo-right">
        <div class="ftodo-dept">${t.dept}</div>
        <div class="ftodo-due ${dc}">${t.due||'마감 미정'}</div>
      </div>
    </div>`;
  }).join('');
}
function toggleTodo(id) {
  const t = todos.find(t => String(t.id) === String(id));
  if (t) { t.done = !t.done; localStorage.setItem('ahn_todos', JSON.stringify(todos)); renderTodos(); }
}

// ── Toast ──
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
</body>
</html>
