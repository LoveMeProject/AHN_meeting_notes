<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AHN 회의록</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --navy: #1a2b4a;
    --navy-mid: #243659;
    --navy-light: #2f4878;
    --accent: #4a90d9;
    --accent-glow: #4a90d940;
    --gold: #e8b84b;
    --bg: #0f1923;
    --bg-card: #162030;
    --bg-input: #1c2d42;
    --border: #2a3f5e;
    --text: #e2eaf5;
    --text-muted: #7a9abf;
    --text-dim: #4a6480;
    --green: #3dd68c;
    --red: #ff6b6b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
  .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header-date { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

  /* Tabs */
  .tabs {
    display: flex; background: var(--bg-card);
    border-bottom: 1px solid var(--border); padding: 0 28px;
  }
  .tab {
    padding: 12px 20px; font-size: 13px; font-weight: 500;
    color: var(--text-muted); cursor: pointer;
    border-bottom: 2px solid transparent; transition: all .2s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  main { flex: 1; padding: 24px 28px; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── WRITE PAGE: 2-column layout ── */
  .write-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    height: calc(100vh - 160px);
  }
  @media (max-width: 900px) {
    .write-layout { grid-template-columns: 1fr; height: auto; }
  }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .panel-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 11px; font-weight: 700; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--text-dim);
    display: flex; align-items: center; justify-content: space-between;
  }
  .panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  /* Form elements */
  label { font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 6px; font-weight: 500; }
  input, select, textarea {
    width: 100%; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 10px 12px; margin-bottom: 16px;
    transition: border-color .2s; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--accent); }
  textarea { resize: vertical; }
  select option { background: var(--bg-card); }

  /* Chips */
  .chip-group { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip {
    padding: 6px 13px; border-radius: 20px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--text-muted); cursor: pointer; transition: all .2s; user-select: none;
  }
  .chip.on { background: var(--navy-light); border-color: var(--accent); color: var(--accent); }

  /* Record button */
  .record-section {
    display: flex; align-items: center; gap: 16px;
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .rec-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--navy-light); border: 2px solid var(--border);
    cursor: pointer; font-size: 22px; display: flex;
    align-items: center; justify-content: center;
    transition: all .2s; flex-shrink: 0; text-decoration: none;
  }
  .rec-btn:hover { border-color: var(--accent); transform: scale(1.05); }
  .rec-info { flex: 1; }
  .rec-title { font-size: 13px; font-weight: 700; margin-bottom: 3px; }
  .rec-desc { font-size: 11px; color: var(--text-muted); line-height: 1.5; }

  /* Generate button */
  .gen-btn {
    width: 100%; padding: 13px;
    background: var(--accent); border: none; border-radius: 10px;
    color: #fff; font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 4px;
  }
  .gen-btn:hover { background: #5a9fe8; transform: translateY(-1px); box-shadow: 0 4px 16px var(--accent-glow); }
  .gen-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* Right panel sections */
  .right-section { margin-bottom: 20px; }
  .section-label {
    font-size: 11px; font-weight: 700; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 10px; display: flex; align-items: center; gap: 6px;
  }
  .section-label .dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .dot-blue { background: var(--accent); }
  .dot-gold { background: var(--gold); }
  .dot-green { background: var(--green); }

  /* Summary box */
  .summary-box {
    background: var(--bg-input); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; font-size: 13px;
    line-height: 1.8; color: var(--text); white-space: pre-wrap;
    min-height: 120px;
  }
  .summary-empty {
    color: var(--text-dim); font-style: italic; font-size: 13px;
    text-align: center; padding: 30px 0;
  }

  /* Memo input */
  .memo-input {
    width: 100%; background: var(--bg-input);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); font-family: inherit; font-size: 13px;
    padding: 12px; min-height: 90px; resize: vertical;
    outline: none; transition: border-color .2s; line-height: 1.7;
    margin-bottom: 0;
  }
  .memo-input:focus { border-color: var(--gold); }

  /* Todo list */
  .todo-items { display: flex; flex-direction: column; gap: 8px; }
  .todo-row {
    display: flex; align-items: flex-start; gap: 10px;
    background: var(--bg-input); border-radius: 8px; padding: 10px 12px;
  }
  .todo-check {
    width: 17px; height: 17px; border-radius: 4px;
    border: 2px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px; transition: all .2s;
  }
  .todo-check.done { background: var(--green); border-color: var(--green); }
  .todo-check.done::after { content: '✓'; font-size: 10px; color: #0f1923; font-weight: 700; }
  .todo-text { font-size: 12px; line-height: 1.6; flex: 1; }
  .todo-text.done { text-decoration: line-through; opacity: .5; }
  .todo-empty { font-size: 12px; color: var(--text-dim); text-align: center; padding: 16px 0; }

  /* Notion save button */
  .notion-btn {
    width: 100%; padding: 13px;
    background: #191919; border: 1px solid #333;
    border-radius: 10px; color: #fff;
    font-family: inherit; font-size: 14px; font-weight: 700;
    cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .notion-btn:hover { background: #2a2a2a; border-color: #555; transform: translateY(-1px); }
  .notion-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .notion-icon { font-size: 18px; }

  /* Panel footer */
  .panel-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 10px;
  }

  /* Spinner */
  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid #ffffff40; border-top-color: #fff;
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── ARCHIVE PAGE ── */
  .arch-header { display: flex; gap: 10px; margin-bottom: 20px; }
  .arch-header input { margin-bottom: 0; }
  .arch-filter { width: auto; margin-bottom: 0; min-width: 130px; }
  .note-list { display: flex; flex-direction: column; gap: 10px; }
  .note-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px 20px; cursor: pointer;
    transition: all .2s; display: flex; justify-content: space-between; gap: 16px;
  }
  .note-card:hover { border-color: var(--accent); transform: translateX(3px); }
  .note-title { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .note-meta { font-size: 12px; color: var(--text-muted); }
  .note-preview { font-size: 12px; color: var(--text-dim); margin-top: 6px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .dept-tag { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-weight: 600; background: var(--navy-light); color: var(--accent); margin: 2px; }
  .empty-state { text-align: center; padding: 60px; color: var(--text-dim); }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  /* ── TODO PAGE ── */
  .todo-filters { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .filter-btn {
    padding: 6px 14px; border-radius: 20px; font-size: 12px;
    border: 1px solid var(--border); background: var(--bg-input);
    color: var(--text-muted); cursor: pointer; transition: all .2s; font-family: inherit;
  }
  .filter-btn.active { background: var(--navy-light); border-color: var(--accent); color: var(--accent); }
  .full-todo-list { display: flex; flex-direction: column; gap: 8px; }
  .full-todo-item {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 10px; padding: 14px 18px;
    display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center;
  }
  .ftodo-check {
    width: 18px; height: 18px; border-radius: 5px;
    border: 2px solid var(--border); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all .2s; background: var(--bg-input);
  }
  .ftodo-check.done { background: var(--green); border-color: var(--green); }
  .ftodo-check.done::after { content: '✓'; font-size: 11px; color: #0f1923; font-weight: 700; }
  .ftodo-text { font-size: 13px; }
  .ftodo-text.done { text-decoration: line-through; opacity: .5; }
  .ftodo-right { text-align: right; font-size: 11px; }
  .ftodo-dept { color: var(--accent); font-weight: 600; }
  .ftodo-due { color: var(--text-dim); margin-top: 2px; }
  .ftodo-due.overdue { color: var(--red); font-weight: 700; }
  .ftodo-due.soon { color: var(--gold); font-weight: 600; }

  /* Modal */
  .modal-overlay {
    position: fixed; inset: 0; background: #00000080;
    z-index: 200; display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; max-width: 700px; width: 100%;
    max-height: 85vh; overflow-y: auto; padding: 28px;
  }
  .modal-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; gap: 12px; }
  .modal-title { font-size: 17px; font-weight: 700; line-height: 1.4; }
  .modal-close {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--text-muted); font-size: 15px; cursor: pointer;
    padding: 4px 10px; flex-shrink: 0; transition: all .2s;
  }
  .modal-close:hover { border-color: var(--red); color: var(--red); }
  .modal-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
  .modal-body { font-size: 13px; line-height: 1.9; white-space: pre-wrap; }
  .modal-del {
    margin-top: 20px; padding: 8px 16px; background: none;
    border: 1px solid var(--red); border-radius: 8px;
    color: var(--red); font-family: inherit; font-size: 12px; cursor: pointer; transition: all .2s;
  }
  .modal-del:hover { background: #ff6b6b20; }

  /* Notion settings modal */
  .notion-modal {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 14px; max-width: 460px; width: 100%; padding: 28px;
  }

  /* Toast */
  .toast {
    position: fixed; bottom: 28px; right: 28px;
    background: var(--navy-light); border: 1px solid var(--accent);
    color: var(--text); padding: 12px 20px; border-radius: 10px;
    font-size: 13px; z-index: 300; opacity: 0; pointer-events: none;
    transition: opacity .3s; transform: translateY(6px);
  }
  .toast.show { opacity: 1; transform: none; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-dot"></div>AHN 회의록</div>
  <div class="header-right">
    <div class="header-date" id="headerDate"></div>
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-page="write" onclick="showPage('write',this)">📝 회의록 작성</div>
  <div class="tab" data-page="archive" onclick="showPage('archive',this)">🗂 보관함</div>
  <div class="tab" data-page="todos" onclick="showPage('todos',this)">✅ To-Do</div>
</div>

<main>

<!-- ══ WRITE PAGE ══ -->
<div class="page active" id="page-write">
  <div class="write-layout">

    <!-- LEFT PANEL -->
    <div class="panel">
      <div class="panel-header">회의 정보 입력</div>
      <div class="panel-body">

        <!-- 녹음 버튼 -->
        <div class="record-section">
          <a class="rec-btn" href="https://clovanote.naver.com" target="_blank" title="클로바 노트 열기">🎙</a>
          <div class="rec-info">
            <div class="rec-title">클로바 노트로 녹음하기</div>
            <div class="rec-desc">버튼을 누르면 클로바 노트가 열려요.<br>녹음 후 변환된 텍스트를 아래에 붙여넣으세요.</div>
          </div>
        </div>

        <label>회의 날짜</label>
        <input type="date" id="iDate">

        <label>안건 (회의 제목)</label>
        <input type="text" id="iTitle" placeholder="예: 겸임제도 폐지 관련 부서 조정">

        <label>참석 부서</label>
        <div class="chip-group" id="deptChips">
          <div class="chip" onclick="toggleChip(this)" data-v="CA(기획조정실)">CA(기획조정실)</div>
          <div class="chip" onclick="toggleChip(this)" data-v="HR본부">HR본부</div>
          <div class="chip" onclick="toggleChip(this)" data-v="재무기획팀">재무기획팀</div>
          <div class="chip" onclick="toggleChip(this)" data-v="외부">외부</div>
        </div>

        <label>참여자</label>
        <input type="text" id="iAttendees" placeholder="예: 김XX 부장, 이XX 팀장">

        <label>회의 유형</label>
        <select id="iType">
          <option value="업무조정">부서간 업무조정</option>
          <option value="탑팀보고">탑팀 보고 준비</option>
          <option value="업무지시">업무지시 / 점검</option>
          <option value="기타">기타</option>
        </select>

        <div class="divider"></div>

        <label>클로바 노트 변환 텍스트 붙여넣기</label>
        <textarea id="iTranscript" placeholder="클로바 노트에서 변환된 텍스트를 여기에 붙여넣으세요." style="min-height:140px"></textarea>

        <button class="gen-btn" id="genBtn" onclick="generate()">
          <span id="genIcon">✨</span>
          <span id="genText">회의록 생성</span>
        </button>

      </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel">
      <div class="panel-header">
        <span>회의록 결과</span>
        <span id="resultStatus" style="font-size:11px;color:var(--text-dim)">회의록 생성 전</span>
      </div>
      <div class="panel-body" id="rightBody">

        <!-- Claude 요약 결과 -->
        <div class="right-section">
          <div class="section-label"><div class="dot dot-blue"></div>Claude 요약 결과</div>
          <div class="summary-box" id="summaryBox">
            <div class="summary-empty">왼쪽에서 회의록 생성을 누르면<br>여기에 요약이 나타납니다</div>
          </div>
        </div>

        <!-- 내 기록 -->
        <div class="right-section">
          <div class="section-label"><div class="dot dot-gold"></div>내 기록</div>
          <textarea class="memo-input" id="iMemo" placeholder="추가할 내용, 내 판단, 후속 메모 등을 자유롭게 입력하세요."></textarea>
        </div>

        <!-- To-Do 목록 -->
        <div class="right-section">
          <div class="section-label"><div class="dot dot-green"></div>To-Do 목록</div>
          <div class="todo-items" id="todoItems">
            <div class="todo-empty">회의록 생성 시 자동으로 추출됩니다</div>
          </div>
        </div>

      </div>

      <!-- 노션 저장 버튼 -->
      <div class="panel-footer">
        <button class="notion-btn" id="notionBtn" onclick="saveToNotion()">
          <span class="notion-icon">◼</span> 노션에 저장
        </button>
      </div>
    </div>

  </div>
</div>

<!-- ══ ARCHIVE PAGE ══ -->
<div class="page" id="page-archive">
  <div class="arch-header">
    <input type="text" placeholder="🔍  키워드 검색..." id="searchQ" oninput="renderArchive()" style="margin-bottom:0">
    <select class="arch-filter" id="filterDept" onchange="renderArchive()" style="margin-bottom:0">
      <option value="">전체 부서</option>
      <option value="CA(기획조정실)">CA</option>
      <option value="HR본부">HR본부</option>
      <option value="재무기획팀">재무기획팀</option>
    </select>
  </div>
  <div class="note-list" id="noteList"></div>
</div>

<!-- ══ TODO PAGE ══ -->
<div class="page" id="page-todos">
  <div class="todo-filters">
    <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
    <button class="filter-btn" onclick="setFilter('pending',this)">진행중</button>
    <button class="filter-btn" onclick="setFilter('done',this)">완료</button>
    <button class="filter-btn" onclick="setFilter('overdue',this)">⚠ 지연</button>
  </div>
  <div class="full-todo-list" id="fullTodoList"></div>
</div>

</main>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="detailTitle"></div>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="modal-meta" id="detailMeta"></div>
    <div class="modal-body" id="detailBody"></div>
    <button class="modal-del" id="detailDelBtn">이 회의록 삭제</button>
  </div>
</div>

<!-- Notion Settings Modal -->
<div class="modal-overlay" id="notionOverlay" onclick="if(event.target===this)closeNotionModal()">
  <div class="notion-modal">
    <div class="modal-head">
      <div class="modal-title">◼ 노션 연동 설정</div>
      <button class="modal-close" onclick="closeNotionModal()">✕</button>
    </div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:20px;line-height:1.7">
      한 번만 입력하면 저장돼요. 이후엔 버튼 하나로 노션에 저장됩니다.
    </div>
    <label>Notion API 키</label>
    <input id="nKey" type="password" placeholder="secret_xxxxxxxxxx...">
    <label>Notion DB ID</label>
    <input id="nDb" type="text" value="38e5866b4b3080dda01f000cb576d326">
    <button class="gen-btn" onclick="confirmNotion()" style="margin-top:4px">저장하고 연동하기</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Data ──
let notes = JSON.parse(localStorage.getItem('ahn_notes') || '[]');
let todos = JSON.parse(localStorage.getItem('ahn_todos') || '[]');
let currentSummary = '';
let todoFilter = 'all';

// ── Init ──
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date();
  document.getElementById('iDate').value = today.toISOString().split('T')[0];
  document.getElementById('headerDate').textContent =
    today.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
});

// ── Page nav ──
function showPage(name, el) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  el.classList.add('active');
  if (name === 'archive') renderArchive();
  if (name === 'todos') renderTodos();
}

// ── Chips ──
function toggleChip(el) { el.classList.toggle('on'); }
function getDepts() {
  return [...document.querySelectorAll('#deptChips .chip.on')].map(c => c.dataset.v);
}

// ── Generate ──
async function generate() {
  const transcript = document.getElementById('iTranscript').value.trim();
  const memo = document.getElementById('iMemo').value.trim();
  if (!transcript && !memo) { showToast('클로바 노트 텍스트 또는 내 기록을 입력해주세요'); return; }

  const title = document.getElementById('iTitle').value.trim() || '회의';
  const date = document.getElementById('iDate').value;
  const depts = getDepts();
  const type = document.getElementById('iType').value;
  const attendees = document.getElementById('iAttendees').value.trim();

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('genIcon').innerHTML = '<div class="spinner"></div>';
  document.getElementById('genText').textContent = 'Claude가 작성 중...';
  document.getElementById('summaryBox').innerHTML = '<div class="summary-empty">작성 중...</div>';

  const prompt = `당신은 본부장 비서 역할의 회의록 전문가입니다.
본부장이 직접 작성한 것처럼 자연스럽고 간결한 회의록을 작성해주세요.

[회의 정보]
- 안건: ${title}
- 날짜: ${date}
- 참석 부서: ${depts.join(', ') || '미선택'}
- 참여자: ${attendees || '미입력'}
- 회의 유형: ${type}

${transcript ? `[클로바 노트 변환 텍스트]\n${transcript}` : ''}
${memo ? `[본부장 메모]\n${memo}` : ''}

아래 형식으로 작성해주세요:

## 회의 목적
(핵심 목적 한두 문장)

## 주요 논의 내용
(부서별/주제별로 bullet 정리)

## 결정 사항
(확정된 내용만 명확히)

## To-Do
- 담당: [부서/담당자] | [할 일 내용] | 마감: YYYY-MM-DD
(마감일 불명확하면 "협의 필요"로)

## 후속 조치
(다음 회의, 보고 일정 등)`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    currentSummary = data.content?.find(c => c.type === 'text')?.text || '생성 실패';

    document.getElementById('summaryBox').textContent = currentSummary;
    document.getElementById('resultStatus').textContent = '✓ 생성 완료';
    document.getElementById('resultStatus').style.color = 'var(--green)';

    // Extract todos
    renderInlineTodos(currentSummary, depts);

  } catch(e) {
    document.getElementById('summaryBox').textContent = '오류: ' + e.message;
  }

  btn.disabled = false;
  document.getElementById('genIcon').textContent = '✨';
  document.getElementById('genText').textContent = '회의록 생성';
}

// ── Inline todos ──
function renderInlineTodos(content, depts) {
  const lines = content.split('\n');
  let inTodo = false;
  const extracted = [];
  for (const line of lines) {
    if (line.includes('To-Do') || line.includes('TODO')) { inTodo = true; continue; }
    if (line.startsWith('## ') && inTodo) inTodo = false;
    if (!inTodo) continue;
    const t = line.replace(/^[-•*]\s*/, '').trim();
    if (t.length > 4) extracted.push(t);
  }

  const container = document.getElementById('todoItems');
  if (!extracted.length) {
    container.innerHTML = '<div class="todo-empty">To-Do 항목이 없습니다</div>';
    return;
  }
  container.innerHTML = extracted.map((t, i) => `
    <div class="todo-row">
      <div class="todo-check" id="itc_${i}" onclick="toggleInlineTodo(${i})"></div>
      <div class="todo-text" id="itt_${i}">${t}</div>
    </div>`).join('');
}

function toggleInlineTodo(i) {
  document.getElementById('itc_' + i).classList.toggle('done');
  document.getElementById('itt_' + i).classList.toggle('done');
}

// ── Notion save ──
function saveToNotion() {
  if (!currentSummary) { showToast('먼저 회의록을 생성해주세요'); return; }
  const key = localStorage.getItem('notion_key');
  const db = localStorage.getItem('notion_db');
  if (!key || !db) { openNotionModal(); return; }
  uploadToNotion(key, db);
}

function openNotionModal() {
  const k = localStorage.getItem('notion_key');
  if (k) document.getElementById('nKey').value = k;
  document.getElementById('notionOverlay').classList.add('open');
}
function closeNotionModal() { document.getElementById('notionOverlay').classList.remove('open'); }
function confirmNotion() {
  const k = document.getElementById('nKey').value.trim();
  const d = document.getElementById('nDb').value.trim();
  if (!k || !d) { showToast('모두 입력해주세요'); return; }
  localStorage.setItem('notion_key', k);
  localStorage.setItem('notion_db', d);
  closeNotionModal();
  uploadToNotion(k, d);
}

async function uploadToNotion(apiKey, dbId) {
  const title = document.getElementById('iTitle').value.trim() || '회의';
  const date = document.getElementById('iDate').value;
  const depts = getDepts();
  const type = document.getElementById('iType').value;
  const memo = document.getElementById('iMemo').value.trim();
  const fullContent = currentSummary + (memo ? '\n\n---\n## 내 기록\n' + memo : '');

  const btn = document.getElementById('notionBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="spinner"></div> 저장 중...';

  // 2000자 단위로 블록 분할
  const chunks = [];
  for (let i = 0; i < fullContent.length; i += 1900) chunks.push(fullContent.slice(i, i+1900));
  const blocks = chunks.map(c => ({
    object: 'block', type: 'paragraph',
    paragraph: { rich_text: [{ type: 'text', text: { content: c } }] }
  }));

  const props = {
    '이름': { title: [{ text: { content: title } }] }
  };
  if (date) props['날짜'] = { date: { start: date } };
  if (depts.length) props['부서'] = { multi_select: depts.map(d => ({ name: d })) };
  if (type) props['회의유형'] = { select: { name: type } };

  try {
    const res = await fetch('https://api.notion.com/v1/pages', {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + apiKey,
        'Content-Type': 'application/json',
        'Notion-Version': '2022-06-28'
      },
      body: JSON.stringify({ parent: { database_id: dbId }, properties: props, children: blocks })
    });

    if (res.ok) {
      showToast('✓ 노션에 저장됐습니다!');
      saveLocal(); // 로컬에도 저장
    } else {
      const err = await res.json();
      if (err.code === 'unauthorized') {
        showToast('API 키를 확인해주세요');
        openNotionModal();
      } else if (err.status === 400 && err.message?.includes('multi_select')) {
        // 부서 속성 없을 때 재시도
        delete props['부서'];
        delete props['회의유형'];
        const res2 = await fetch('https://api.notion.com/v1/pages', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + apiKey, 'Content-Type': 'application/json', 'Notion-Version': '2022-06-28' },
          body: JSON.stringify({ parent: { database_id: dbId }, properties: props, children: blocks })
        });
        if (res2.ok) { showToast('✓ 노션에 저장됐습니다!'); saveLocal(); }
        else showToast('저장 실패: ' + (await res2.json()).message);
      } else {
        showToast('저장 실패: ' + (err.message || JSON.stringify(err)));
      }
    }
  } catch(e) {
    showToast('CORS 오류: 노션 API는 브라우저에서 직접 호출이 제한됩니다');
    console.error(e);
  }

  btn.disabled = false;
  btn.innerHTML = '<span class="notion-icon">◼</span> 노션에 저장';
}

// ── Local save ──
function saveLocal() {
  const note = {
    id: Date.now(),
    title: document.getElementById('iTitle').value.trim() || '무제',
    date: document.getElementById('iDate').value,
    depts: getDepts(),
    type: document.getElementById('iType').value,
    content: currentSummary,
    memo: document.getElementById('iMemo').value.trim(),
    createdAt: new Date().toISOString()
  };
  notes.unshift(note);
  localStorage.setItem('ahn_notes', JSON.stringify(notes));

  // Extract & save todos
  const lines = currentSummary.split('\n');
  let inTodo = false;
  for (const line of lines) {
    if (line.includes('To-Do')) { inTodo = true; continue; }
    if (line.startsWith('## ') && inTodo) inTodo = false;
    if (!inTodo) continue;
    const t = line.replace(/^[-•*]\s*/, '').trim();
    if (t.length < 5) continue;
    const dueMatch = t.match(/마감[:\s]+(\d{4}-\d{2}-\d{2})/);
    const deptMatch = t.match(/담당[:\s]+([^|]+)\|/);
    todos.push({
      id: Date.now() + Math.random(),
      text: t,
      dept: deptMatch ? deptMatch[1].trim() : (note.depts[0] || ''),
      due: dueMatch ? dueMatch[1] : null,
      done: false,
      noteId: note.id,
      noteTitle: note.title
    });
  }
  localStorage.setItem('ahn_todos', JSON.stringify(todos));
}

// ── Archive ──
function renderArchive() {
  const q = (document.getElementById('searchQ')?.value || '').toLowerCase();
  const dept = document.getElementById('filterDept')?.value || '';
  let list = notes.filter(n => {
    if (dept && !n.depts.includes(dept)) return false;
    if (q && !n.title.toLowerCase().includes(q) && !n.content.toLowerCase().includes(q)) return false;
    return true;
  });
  const el = document.getElementById('noteList');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📂</div>저장된 회의록이 없습니다</div>`;
    return;
  }
  el.innerHTML = list.map(n => `
    <div class="note-card" onclick="openDetail(${n.id})">
      <div>
        <div class="note-title">${n.title}</div>
        <div class="note-meta">${n.date} · ${n.type}</div>
        <div class="note-preview">${n.content.substring(0,100)}...</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        ${n.depts.map(d => `<span class="dept-tag">${d}</span>`).join('')}
      </div>
    </div>`).join('');
}

function openDetail(id) {
  const n = notes.find(n => n.id === id);
  if (!n) return;
  document.getElementById('detailTitle').textContent = n.title;
  document.getElementById('detailMeta').textContent = n.date + ' · ' + n.depts.join(', ') + ' · ' + n.type;
  document.getElementById('detailBody').textContent = n.content + (n.memo ? '\n\n---\n내 기록:\n' + n.memo : '');
  document.getElementById('detailDelBtn').onclick = () => deleteNote(id);
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
function deleteNote(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  notes = notes.filter(n => n.id !== id);
  todos = todos.filter(t => t.noteId !== id);
  localStorage.setItem('ahn_notes', JSON.stringify(notes));
  localStorage.setItem('ahn_todos', JSON.stringify(todos));
  closeDetail(); renderArchive(); renderTodos();
  showToast('삭제됐습니다');
}

// ── Todos ──
function setFilter(f, el) {
  todoFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderTodos();
}
function renderTodos() {
  const today = new Date().toISOString().split('T')[0];
  const soon = new Date(Date.now() + 3*24*60*60*1000).toISOString().split('T')[0];
  let list = [...todos];
  if (todoFilter === 'pending') list = list.filter(t => !t.done);
  if (todoFilter === 'done') list = list.filter(t => t.done);
  if (todoFilter === 'overdue') list = list.filter(t => !t.done && t.due && t.due < today);
  list.sort((a,b) => (!a.due?1:!b.due?-1:a.due.localeCompare(b.due)));

  const el = document.getElementById('fullTodoList');
  if (!list.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">✅</div>해당 항목이 없습니다</div>`;
    return;
  }
  el.innerHTML = list.map(t => {
    let dc = '';
    if (t.due) { if (t.due < today) dc='overdue'; else if (t.due <= soon) dc='soon'; }
    return `
    <div class="full-todo-item">
      <div class="ftodo-check ${t.done?'done':''}" onclick="toggleTodo('${t.id}')"></div>
      <div>
        <div class="ftodo-text ${t.done?'done':''}">${t.text}</div>
        <div style="font-size:11px;color:var(--text-dim);margin-top:2px">${t.noteTitle||''}</div>
      </div>
      <div class="ftodo-right">
        <div class="ftodo-dept">${t.dept}</div>
        <div class="ftodo-due ${dc}">${t.due||'마감 미정'}</div>
      </div>
    </div>`;
  }).join('');
}
function toggleTodo(id) {
  const t = todos.find(t => String(t.id) === String(id));
  if (t) { t.done = !t.done; localStorage.setItem('ahn_todos', JSON.stringify(todos)); renderTodos(); }
}

// ── Toast ──
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}
</script>
